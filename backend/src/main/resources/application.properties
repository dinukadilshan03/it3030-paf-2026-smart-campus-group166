spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:Smart Campus Admin}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@smartcampus.local}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
