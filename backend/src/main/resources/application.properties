spring.application.name=backend
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartcampus}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.temp-password=${BOOTSTRAP_ADMIN_TEMP_PASSWORD:}
app.auth.local.max-failed-attempts=${LOCAL_AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.local.lock-duration-minutes=${LOCAL_AUTH_LOCK_DURATION_MINUTES:15}
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.storage.resource-images-bucket=${SUPABASE_RESOURCE_IMAGES_BUCKET:resource-images}
app.supabase.storage.ticket-attachments-bucket=${SUPABASE_TICKET_ATTACHMENTS_BUCKET:ticket-attachments}
